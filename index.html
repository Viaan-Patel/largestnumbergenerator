<!DOCTYPE html>
<html>
<head>
<title>Large Number Finder</title>

<style>
h1{
    color:purple;
    font-family: arial;
}
button{
    background-color: brown;
    color:wheat;
    border-radius:5px;
    border:none;
    padding:10px;
    margin-top: 5px;
}
body{
    background-image: url(https://www.industrialempathy.com/img/remote/ZiClJf-1920w.jpg);
    background-repeat: no-repeat;
    background-size: cover;
}
label{
    color: lightgreen;
    font-family: arial;
    font-size: 20px;
}
p{
    font-size: 22px;
    color:whitesmoke;
}

</style>
</head>
<body>
<center>
<h1>WHICH IS THE LARGEST NUMBER?</h1>
<label>Enter numbers (comma-seperated)</label>
<input id="numbers" type="text" placeholder="eg: 5,2,8,13">
<button onclick="largestNumber()">Find Largest Number</button>
<p id="result"></p>
</center>
<script>
function largestNumber(){
let inputs = document.getElementById("numbers").value;
let inputNumbers = inputs.split(",").map(Number);
let largestNum = Math.max(...inputNumbers);
document.getElementById("result").innerHTML = "The largest number is:"+largestNum;

}


</script>
</body>
</html>
